# Comprueba cada rama y PR; solo main publica web/ en GitHub Pages.
# Acciones fijadas por SHA de commit; el comentario indica la versión (Dependabot lo actualiza).
name: CI y Pages

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# Sin permisos por defecto: cada job declara los suyos.
permissions: {}

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  # En ramas de trabajo se cancela la ejecución anterior; en main nunca.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: check (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Mínimo de "engines" en package.json y la LTS vigente.
        node: ['22.13.0', 'lts/*']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Instalar herramientas sin scripts de instalación
        run: npm ci --ignore-scripts
      - name: Lint, formato y verificadores
        run: npm run check

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Este job no instala dependencias npm: solo empaqueta web/ y lo publica.
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web
          retention-days: 1
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
